<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b6b3a"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon.svg"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; form-action https://formsubmit.co; base-uri 'self'; object-src 'none'"><link rel="stylesheet" href="radio.css?v=20261020a"><title>Apply to be played · Island Beats Radio BETA</title></head><body><div class="flagstripe"></div>
<header class="rack top"><a class="back" href="./">‹ Radio</a><div class="brand"><h1>Apply to be played on Island Beats Radio <span class="beta">BETA</span></h1></div></header>
<p class="tester">This is an application for review, not instant access. We review every application and email you if approved.</p>
<form class="rack form" id="f" action="https://formsubmit.co/madinc47@gmail.com" method="POST" data-kind="application">
<input type="hidden" name="_subject" id="subj" value="Island Beats Radio application">
<input type="hidden" name="_captcha" value="true"><input type="hidden" name="_template" value="table">
<input type="hidden" name="_next" value="https://madinc47-prog.github.io/radio/thanks.html?f=apply">
<input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
<label>Artist / stage name *<input name="artist" id="artist" required maxlength="80"></label>
<label>Legal name *<input name="legal_name" required maxlength="120"></label>
<label>Email *<input type="email" name="email" required></label>
<label>Phone / WhatsApp (optional)<input type="tel" name="phone"></label>
<label>Country / parish *<select name="parish" required><option value="">Choose…</option><option>Saint Andrew</option><option>Saint David</option><option>Saint George</option><option>Saint John</option><option>Saint Joseph</option><option>Saint Luke</option><option>Saint Mark</option><option>Saint Patrick</option><option>Saint Paul</option><option>Saint Peter</option><option>Other (outside Dominica)</option></select></label>
<label>Genre(s) *<input name="genres" required placeholder="Bouyon, dancehall, hip-hop, gospel…"></label>
<label>Short bio *<textarea name="bio" required maxlength="600" rows="4"></textarea></label>
<label>Track title(s) *<input name="tracks" required></label>
<label>Link to the track * (SoundCloud, YouTube, Google Drive, Audiomack — no file uploads)<input type="url" name="track_link" required placeholder="https://"></label>
<label>Explicit lyrics? *<select name="explicit" required><option value="">Choose…</option><option>No (clean)</option><option>Yes (explicit)</option></select></label>
<label>Release year<input type="number" name="release_year" min="1950" max="2030"></label>
<label>Social links<textarea name="socials" rows="2"></textarea></label>
<label class="cb"><input type="checkbox" name="rights" value="yes" required> I own or control all rights (master + publishing) to this track *</label>
<label class="cb"><input type="checkbox" name="samples" value="yes" required> No uncleared samples *</label>
<label class="cb"><input type="checkbox" name="stream_ok" value="yes" required> I agree Island Beats Radio may stream it for free during beta *</label>
<label class="cb"><input type="checkbox" name="age" value="yes" required> I am 18+ (or my parent/guardian approves this application) *</label>
<button class="btn play big" type="submit">Send application</button>
<p class="note">Sent by email through FormSubmit. Applying does not guarantee airplay.</p>
</form><script src="form.js"></script></body></html>
