<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b6b3a"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon.svg"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; form-action https://formsubmit.co; base-uri 'self'; object-src 'none'"><link rel="stylesheet" href="radio.css?v=20261020a"><title>Pin your ad · Island Beats Radio BETA</title></head><body><div class="flagstripe"></div>
<header class="rack top"><a class="back" href="./#ads">‹ Radio</a><div class="brand"><h1>Pin your ad <span class="beta">BETA</span></h1></div></header>
<p class="tester">Pricing coming soon — free during beta, pending approval. Every ad is reviewed before it goes live. No payment is taken.</p>
<form class="rack form" action="https://formsubmit.co/madinc47@gmail.com" method="POST" data-kind="ad">
<input type="hidden" name="_subject" id="subj" value="Island Beats Radio ad request">
<input type="hidden" name="_captcha" value="true"><input type="hidden" name="_template" value="table">
<input type="hidden" name="_next" value="https://madinc47-prog.github.io/radio/thanks.html?f=ad">
<input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
<label>Business name *<input name="business" id="artist" required maxlength="60"></label>
<label>Short message * (max 120 characters)<input name="message" required maxlength="120"></label>
<label>Link * (your website, Facebook or WhatsApp link)<input type="url" name="link" required placeholder="https://"></label>
<label>Image link (optional — a link, not an upload)<input type="url" name="image_link" placeholder="https://"></label>
<label>Contact email *<input type="email" name="email" required></label>
<label class="cb"><input type="checkbox" name="terms" value="yes" required> I agree to the terms: the ad is honest and legal, I may use the name/image, and Island Beats Radio may approve, edit or remove it *</label>
<button class="btn play big" type="submit">Send ad for approval</button>
</form><script src="form.js"></script></body></html>
