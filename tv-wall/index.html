<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Island TV Wall · Free live Dominica</title><meta name="theme-color" content="#000"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="app.css?v=20261024b"></head><body>
<div id="tv" class="tv off"><div class="screen" id="screen">
 <div id="main" class="main"></div>
 <div id="wall" class="wall hidden"></div>
 <div id="osd" class="osd hidden"><b id="osdNum"></b><span id="osdName"></span></div>
 <div id="info" class="info hidden"></div>
 <div id="vol" class="volbar hidden"><i></i></div>
 <div id="guide" class="panel hidden"><h2>Channel guide</h2><div id="epg" class="epg"></div></div>
 <div id="events" class="panel hidden"><h2>Upcoming events <small>(America/Dominica · from cited sources)</small></h2><div id="evlist"></div></div>
 <div id="tapPlay" class="tapplay hidden"><span>▶ Tap to play</span></div><div class="flash"></div>
</div><div class="brandbar"><a href="../tv/" class="back">‹ Island TV</a><span>ISLAND·TV WALL</span><i id="led" class="led"></i></div></div>
<nav id="remote" class="remote" aria-label="Remote">
 <button data-k="power" class="red">⏻</button><button data-k="chup">CH ▲</button><button data-k="chdn">CH ▼</button>
 <button data-k="volup">VOL +</button><button data-k="voldn">VOL −</button><button data-k="mute">🔇</button>
 <button data-k="guide">GUIDE</button><button data-k="events">EVENTS</button><button data-k="info">INFO</button>
 <button data-k="wall">2×2</button><button data-k="full">⛶</button>
 <div class="keys"><button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button><button data-n="5">5</button><button data-n="6">6</button><button data-n="7">7</button><button data-n="8">8</button><button data-n="9">9</button><button data-n="0">0</button></div>
</nav>
<script src="/shared/raw-mic.js?v=20261023rm"></script>
<script src="app.js?v=20261024b"></script><script src="fs.js?v=20261024b"></script></body></html>
