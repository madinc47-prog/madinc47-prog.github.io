<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' blob: mediastream:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
<title>Collab Room · Island Pin</title>
<link rel="stylesheet" href="collab.css?v=20261022b">
<link rel="stylesheet" href="room.css?v=20261022b">
</head>
<body class="roompage">
<header class="top">
  <a class="back" href="./">← Map</a>
  <h1>🎧 Collab Room <small id="peer-name"></small></h1>
  <span id="conn" class="conn">offline</span>
</header>
<div id="gate" class="pending" hidden></div>
<div id="status" class="status" role="status" aria-live="polite"></div>
<section id="invite" class="panel" hidden>
  <p id="invite-text"></p>
  <div class="row"><button id="accept" class="btn primary">✅ Accept &amp; join</button><button id="decline" class="btn ghost">Decline</button></div>
</section>
<section id="nettest" class="panel">
  <b>Connection check</b> <button id="test" class="btn">🔌 Test my connection</button>
  <p id="test-out" class="meta"></p>
</section>
<main id="room" class="room" hidden>
  <div class="stage">
    <div class="tiles">
      <figure class="tile"><video id="v-remote" autoplay playsinline></video><div id="a-remote" class="av big"></div><figcaption id="cap-remote">Partner</figcaption></figure>
      <figure class="tile me"><video id="v-local" autoplay playsinline muted></video><div id="a-local" class="av big"></div><figcaption>You</figcaption></figure>
    </div>
    <div class="bar">
      <button id="b-mic" class="btn">🎙 Mute</button>
      <button id="b-cam" class="btn">📷 Camera off</button>
      <label class="btn sw"><input type="checkbox" id="b-raw"> Record quality</label>
      <button id="b-end" class="btn danger">⏹ End</button>
    </div>
    <div class="panel beat">
      <b>Shared beat</b>
      <label class="btn">📂 Load beat<input id="beat-file" type="file" accept="audio/*" hidden></label>
      <span id="beat-name" class="meta">none</span>
      <select id="beat-mode"><option value="stream">Stream my beat to partner</option><option value="sync">We both load the same file (synced start)</option></select>
      <button id="beat-go" class="btn primary">▶ Start (3-2-1)</button><button id="beat-stop" class="btn">■ Stop</button>
      <b id="count" class="count"></b>
    </div>
    <div class="panel rec">
      <b>Record (raw — no effects)</b>
      <button id="r-me" class="btn">⏺ My mic</button>
      <button id="r-peer" class="btn">⏺ Partner's mic</button>
      <button id="r-usepeer" class="btn ghost" title="Your mic is missing or broken? Record your partner's live mic as your track.">🎤 Use partner's mic</button>
      <span id="r-state" class="meta"></span>
      <ul id="takes" class="takes"></ul>
    </div>
    <div class="panel mv">
      <b>🎬 Music-video take</b> <span class="meta">Both cameras on. Beat + 3-2-1 on both sides; each records their own camera in full quality, then clips swap directly (no server).</span>
      <button id="mv-go" class="btn primary">🎬 Start synced take</button>
      <button id="mv-stop" class="btn">■ Stop take</button>
      <button id="mv-backup" class="btn ghost">⏺ Backup: record partner's live stream</button>
      <span id="mv-state" class="meta"></span>
      <ul id="clips" class="takes"></ul>
      <button id="mv-sidecar" class="btn ghost">⬇ Sync sheet (.json) for the editor</button>
    </div>
  </div>
  <aside class="side">
    <div class="panel lyr">
      <b>Lyrics</b> <button id="ly-load" class="btn ghost">From Lyrics Lab</button> <button id="ly-share" class="btn ghost">Share</button> <button id="ly-scroll" class="btn ghost">▶ Scroll</button>
      <select id="ly-pick" hidden></select>
      <textarea id="ly" placeholder="Paste or write your bars here…" maxlength="8000"></textarea>
    </div>
    <div class="panel chat"><b>Chat</b><div id="chat" class="msgs"></div>
      <form id="chat-f" class="send"><input id="chat-in" maxlength="500" placeholder="Message…" autocomplete="off"><button class="btn primary">Send</button></form></div>
  </aside>
</main>
<audio id="beat-el" hidden></audio>
<audio id="remote-audio" autoplay hidden></audio>
<script src="/shared/raw-mic.js?v=20261023rm"></script>
<script src="config.js"></script>
<script src="../shared/collab-core.js?v=20261022b"></script>
<script src="room-mv.js?v=20261022b"></script>
<script src="room.js?v=20261022b"></script>
</body>
</html>
